<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inscreva-se na nossa Newsletter</title>
</head>
<body>
    <header class="container">
        <div class="logo">
            <img src="img/logo.png" alt="Logo DevConnect">
            <span>DevConnect</span>

            </div>

            <nav class="nav">
                <a href="#">Home</a>
                <a href="#">Serviços</a>
                <a href="#">Sobre</a>
                <a href="#">Contato</a>
                <a href="#">FAQ</a>
            </nav>
    </header>

    <main class="container">

    <div class="content">

        <h1>
            Inscreva-se Agora <br>
            na Nossa <span>Newsletter</span>
        </h1>

        <p>
            Toda semana, receba dicas de programação, novidades do mercado
            de tecnologia e conteúdos selecionados para ajudar você a
            desenvolver suas habilidades e acompanhar as principais
            tendências da área.
        </p>

        <form>
            <div class="form-group">
                <input type="text" placeholder="Nome">
            </div>

            <div class="form-group">
                <input type="email" placeholder="Email">
            </div>

            <button type="submit">Enviar</button>
        </form>

    </div>

    <div class="image-container">
        <div class="ellipse"></div>
        <img src="img/banner.jpg" alt="Banner usuários digitando">
    </div>

</main>





</body>
</html>
